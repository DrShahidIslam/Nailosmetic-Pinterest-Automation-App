# ============================================================
# Aesthetic Daily WordPress Automation — GitHub Actions Workflow
# ============================================================
# This workflow runs the WordPress bot twice a day.
# It generates an article and pushes it to your site.

name: 📝 Daily WordPress Article

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Run 2 times a day (09:00, 21:00 UTC) to meet the daily article target
    - cron: "0 9,21 * * *"

  # Allow manual triggering
  workflow_dispatch:

concurrency:
  group: bot-data-sync
  cancel-in-progress: false

jobs:
  publish-article:
    name: Generate & Publish WordPress Article
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to update history.json and links_queue.json

    steps:
      # 1. Check out the repository
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. Install dependencies
      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      # 4. Run the WordPress bot
      - name: 🚀 Run WordPress Bot
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          HUGGINGFACE_API_KEYS: ${{ secrets.HUGGINGFACE_API_KEYS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USER: ${{ secrets.WORDPRESS_USER }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
        run: python wordpress_automation/main.py

      # 5. Commit shared data changes
      - name: 💾 Commit updated history and queue
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add shared/*.json
          git commit -m "📝 Update history and link queue [skip ci]" || exit 0
          
          # Use a robust pull strategy: pull remote changes, then re-merge our data
          git pull --rebase origin main || (
            echo "⚠️ Conflict detected! Running Smart Merge..."
            git rebase --abort
            git fetch origin main
            python shared_data_manager.py --resolve-conflicts
            git add shared/*.json
            git commit -m "📝 Resolve data conflicts [skip ci]"
            # Fetch again just in case, then merge taking our resolved files
            git pull origin main --no-rebase -s recursive -X ours
          )
          git push
