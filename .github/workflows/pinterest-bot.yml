# ============================================================
# Nailosmetic Pinterest Automation Bot — GitHub Actions Workflow
# ============================================================
# Strategy: Month 3+ (Account 2+ months old)
# Volume: Up to 15 pins/day (every ~96 minutes / 15 runs per day)
# URL Safety: 7-day cooldown enforced per URL via shared/pin_log.json

name: 📌 Daily Pinterest Pin

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # 15 runs/day spread evenly — Month 3+ strategy (account is 2+ months old)
    - cron: "0 0,2,4,6,7,8,10,12,13,14,16,18,20,21,22 * * *"

  # Allow manual triggering from the GitHub Actions UI
  workflow_dispatch:

concurrency:
  group: bot-data-sync
  cancel-in-progress: false

jobs:
  publish-pin:
    name: Generate & Publish Nail Art Pin
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to update links_queue.json

    steps:
      # 1. Check out the repository
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. Install dependencies
      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      # 4. Run the bot
      - name: 🚀 Run Pinterest Bot
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_API_KEYS: ${{ secrets.HUGGINGFACE_API_KEYS }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_AESTHETIC: ${{ secrets.PINTEREST_BOARD_AESTHETIC }}
          PINTEREST_BOARD_CHROME: ${{ secrets.PINTEREST_BOARD_CHROME }}
          PINTEREST_BOARD_MINIMALIST: ${{ secrets.PINTEREST_BOARD_MINIMALIST }}
          PINTEREST_BOARD_SPRING: ${{ secrets.PINTEREST_BOARD_SPRING }}
          PINTEREST_BOARD_SUMMER: ${{ secrets.PINTEREST_BOARD_SUMMER }}
          PINTEREST_BOARD_HAIR: ${{ secrets.PINTEREST_BOARD_HAIR }}
          PINTEREST_BOARD_BEAUTY: ${{ secrets.PINTEREST_BOARD_BEAUTY }}
          PINTEREST_BOARD_HOME: ${{ secrets.PINTEREST_BOARD_HOME }}
          PINTEREST_BOARD_GARDEN: ${{ secrets.PINTEREST_BOARD_GARDEN }}
          PINTEREST_BOARD_FASHION: ${{ secrets.PINTEREST_BOARD_FASHION }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
        run: python main.py

      # 4.5. Update Secret if token rotated
      - name: 🔐 Update Refresh Token Secret
        if: env.NEW_PINTEREST_REFRESH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set PINTEREST_REFRESH_TOKEN --body "${{ env.NEW_PINTEREST_REFRESH_TOKEN }}"

      # 5. Commit shared data changes (including pin safety log)
      - name: 💾 Commit updated history, pin log, and queue
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add shared/*.json
          git commit -m "📝 Update history, pin log, and link queue [skip ci]" || exit 0
          
          # Use a robust pull strategy: pull remote changes, then re-merge our data
          git pull --rebase origin main || (
            echo "⚠️ Conflict detected! Running Smart Merge..."
            git rebase --abort
            git fetch origin main
            python shared_data_manager.py --resolve-conflicts
            git add shared/*.json
            git commit -m "📝 Resolve data conflicts [skip ci]"
            # Fetch again just in case, then merge taking our resolved files
            git pull origin main --no-rebase -s recursive -X ours
          )
          git push
