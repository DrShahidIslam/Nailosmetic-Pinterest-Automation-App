# ============================================================
# Bulk Focus Keyword Setter — GitHub Actions Workflow
# ============================================================
# One-shot workflow that sets Rank Math focus keywords on all
# existing posts that are missing one. Run manually via
# workflow_dispatch. Safe to re-run — skips posts that already
# have a keyword set.
# ============================================================

name: 🔑 Bulk Set Focus Keywords

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:  # Manual trigger only — run once

jobs:
  set-keywords:
    name: Set Focus Keywords on All Posts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🔑 Run Bulk Focus Keyword Setter
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USER: ${{ secrets.WORDPRESS_USER }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
        run: python wordpress_automation/bulk_set_focus_keywords.py
