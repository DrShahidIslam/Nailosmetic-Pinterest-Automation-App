# ============================================================
# Bulk Resave Posts — GitHub Actions Workflow
# ============================================================
# Forces Rank Math to recalculate SEO scores on all existing
# posts by touch-resaving each one (fires the save_post hook).
#
# Run manually once via workflow_dispatch.
# Safe to re-run — idempotent, no data is changed.
# ============================================================

name: 🔄 Bulk Resave Posts (Rank Math Fix)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  resave-posts:
    name: Touch-Resave All Posts to Trigger Rank Math
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🔄 Run Bulk Resave
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USER: ${{ secrets.WORDPRESS_USER }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
        run: python wordpress_automation/bulk_resave_posts.py
