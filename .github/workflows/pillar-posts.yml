# ============================================================
# Nailosmetic Pillar Posts — GitHub Actions Workflow
# ============================================================
# Publishes ONE pillar post per run via wordpress_automation/publish_pillars.py.
# Progress is tracked in shared/pillar_state.json; when all configured
# pillars are published the script exits cleanly, so this workflow can
# stay enabled permanently. Restored 2026-11-02 (the workflow referenced
# in publish_pillars.py's docstring was missing from the repo).

name: 🏛️ Pillar Posts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

on:
  schedule:
    # Daily at 10:30 UTC — offset from the WordPress bot (09:00/21:00 UTC)
    - cron: "30 10 * * *"

  # Allow manual triggering
  workflow_dispatch:

concurrency:
  group: bot-data-sync
  cancel-in-progress: false

jobs:
  publish-pillar:
    name: Publish Next Pillar Post
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to update shared/pillar_state.json and link data

    steps:
      # 1. Check out the repository
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. Install dependencies
      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      # 4. Run the pillar publisher (publishes at most one pillar per run)
      - name: 🏛️ Run Pillar Publisher
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_API_KEYS: ${{ secrets.HUGGINGFACE_API_KEYS }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USER: ${{ secrets.WORDPRESS_USER }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
        run: python -u wordpress_automation/publish_pillars.py

      # 5. Commit shared data changes (same pattern as wordpress-bot.yml)
      - name: 💾 Commit updated pillar state and links
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add shared/*.json
          git commit -m "🏛️ Update pillar state and links [skip ci]" || exit 0

          # Clean any unstaged/ephemeral files so rebase is never blocked
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true

          # Use a robust pull strategy: pull remote changes, then re-merge our data
          git pull --rebase origin main || (
            echo "⚠️ Conflict detected! Running Smart Merge..."
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            python shared_data_manager.py --resolve-conflicts
            git add shared/*.json
            git commit -m "🏛️ Resolve data conflicts [skip ci]" || true
            # Fetch again just in case, then merge taking our resolved files
            git pull origin main --no-rebase -s recursive -X ours || true
          )
          git push
