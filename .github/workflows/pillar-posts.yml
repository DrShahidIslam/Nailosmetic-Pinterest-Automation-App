# ============================================================
# Pillar Posts Publisher — GitHub Actions Workflow
# ============================================================
# Publishes one SEO pillar post per day for 5 consecutive days.
# Progress is tracked in shared/pillar_state.json — the script
# exits cleanly once all 5 pillars are published, so this
# workflow can stay permanently enabled without wasted runs.
#
# Image priority: HuggingFace FLUX → SiliconFlow Kolors → Pollinations
# ============================================================

name: 🏛️ Pillar Post Publisher

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Run daily at 07:00 UTC — offset from the main bots (09:00, 21:00)
    # to avoid the bot-data-sync concurrency group collision
    - cron: "0 7 * * *"

  # Allow manual triggering (useful for testing or re-running a failed pillar)
  workflow_dispatch:

concurrency:
  group: pillar-publisher
  cancel-in-progress: false

jobs:
  publish-pillar:
    name: Publish Next Pillar Post
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit pillar_state.json and shared/*.json

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────────────
      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Install dependencies ──────────────────────────────────────────
      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      # ── 4. WordPress connectivity check (same pattern as main bots) ──────
      - name: 🔌 WordPress Connectivity Check
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USER: ${{ secrets.WORDPRESS_USER }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
        run: |
          python - <<'EOF'
          import os, sys, time, socket, requests, base64
          url = os.environ["WORDPRESS_URL"].rstrip("/") + "/wp-json/wp/v2/categories?per_page=1"
          user = os.environ["WORDPRESS_USER"]
          pwd  = os.environ["WORDPRESS_APP_PASSWORD"]
          auth = base64.b64encode(f"{user}:{pwd}".encode()).decode()
          headers = {"Authorization": f"Basic {auth}"}
          for attempt in range(5):
              try:
                  r = requests.get(url, headers=headers, timeout=30)
                  r.raise_for_status()
                  print(f"✅ WordPress reachable on attempt {attempt+1}")
                  sys.exit(0)
              except Exception as e:
                  wait = 30 * (attempt + 1)
                  print(f"⚠️  Attempt {attempt+1}/5 failed: {e} — retry in {wait}s")
                  time.sleep(wait)
          print("❌ WordPress unreachable after 5 attempts. Aborting.")
          sys.exit(1)
          EOF

      # ── 5. Run the Pillar Publisher ───────────────────────────────────────
      - name: 🏛️ Publish Next Pillar Post
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          HUGGINGFACE_API_KEYS: ${{ secrets.HUGGINGFACE_API_KEYS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USER: ${{ secrets.WORDPRESS_USER }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
        run: python wordpress_automation/publish_pillars.py

      # ── 6. Commit updated state and shared data ───────────────────────────
      - name: 💾 Commit pillar state and shared data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add shared/*.json
          git commit -m "🏛️ Pillar post published — update state [skip ci]" || exit 0

          # Same robust pull-rebase strategy as other bots
          git pull --rebase origin main || (
            echo "⚠️ Conflict detected — running Smart Merge..."
            git rebase --abort
            git fetch origin main
            python shared_data_manager.py --resolve-conflicts
            git add shared/*.json
            git commit -m "🏛️ Resolve pillar data conflicts [skip ci]"
            git pull origin main --no-rebase -s recursive -X ours
          )
          git push
